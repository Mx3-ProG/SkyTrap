[project]
name = "skytrap"
version = "0.1.0"
description = "SkyTrap — local-first, open source AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "httpx>=0.27",
    "prompt-toolkit>=3.0.53",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
    "websockets>=17.0.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "playwright>=1.62.0",
]

[project.scripts]
skytrap = "skytrap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skytrap"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
